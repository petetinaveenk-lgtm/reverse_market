spring.application.name=marketplace

server.port=${PORT:8081}

spring.config.import=optional:file:./application-local.properties

app.admin.registration-key=${ADMIN_REGISTRATION_KEY:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:5173}
app.jwt.secret=${APP_JWT_SECRET:ReverseMarketplaceSecretKeyForJWTAuthentication2026}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reverse_marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:naveen2006}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false